<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotiza tu Auto - KIA MAX SALTILLO</title>
  <link rel="stylesheet" href="style.css">

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    fbq('init', 'TU_PIXEL_ID'); // Reemplaza con tu ID real de Meta Pixel
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=TU_PIXEL_ID&ev=PageView&noscript=1" />
  </noscript>
  <!-- End Meta Pixel Code -->
</head>
<body>

  <!-- Header fuera del contenedor -->
  <div class="header-cotizador">
    <span class="agencia-tag">KIA MAX SALTILLO</span>
    <h1>Tu cotización</h1>
    <p class="asesor-info">Asesor: Abel Ortiz Silva | Cel: 844 806 7192</p>
  </div>

  <div class="cotizador-container">
    
    <div class="form-group">
      <label for="tipo-select">TIPO DE VEHÍCULO</label>
      <select id="tipo-select">
        <option value="AUTOMOVIL">AUTOMÓVIL</option>
      </select>
    </div>

    <div class="form-group">
      <label for="unidad-select">UNIDAD</label>
      <select id="unidad-select">
        <option value="K3 SEDAN">K3 SEDAN</option>
      </select>
    </div>

    <div class="form-group">
      <label for="version-select">VERSIÓN</label>
      <select id="version-select">
        <option value="L TM">L TM</option>
        <option value="LX TM">LX TM</option>
      </select>
    </div>

    <!-- Precio Lista -->
    <div class="precio-header">
      <span>Precio de Lista:</span>
      <strong id="precio-val">$304,900.00</strong>
    </div>

    <!-- Observación / Alerta -->
    <div class="observacion-box" id="observacion-box">
      <span class="info-icon">ⓘ</span>
      <span id="observacion-txt">ELIGE TU ENGANCHE Y LISTO!</span>
    </div>

    <!-- Enganche -->
    <div class="form-group">
      <label for="enganche-select">ENGANCHE</label>
      <select id="enganche-select">
        <!-- Opciones dinámicas -->
      </select>
    </div>

    <!-- Tasa Anual Aplicada -->
    <div class="tasa-box">
      <span>Tasa Anual Aplicada:</span>
      <strong id="tasa-val">12.99%</strong>
    </div>

    <!-- Bloque de Mensualidades -->
    <div class="mensualidades-section">
      <label class="section-label">MENSUALIDADES</label>
      <div id="lista-mensualidades" class="lista-mensualidades">
        <!-- Filas dinámicas -->
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="acciones-container">
      <button class="btn-contacto" id="btn-contacto" onclick="contactarWhatsApp()">
        ¿Deseas más información? Contáctanos &rsaquo;
      </button>
      <button class="btn-pdf" id="btn-pdf" onclick="window.print()">
        📄 Descargar Cotización (PDF)
      </button>
    </div>

  </div>

  <!-- Pie Legal -->
  <footer class="footer-legal">
    Precios y mensualidades sujetos a aprobación de crédito. KIA MAX Saltillo.
  </footer>

  <script src="script.js"></script>
</body>
</html>
